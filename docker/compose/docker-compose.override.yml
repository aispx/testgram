# Local override: MyTelegram.SessionServer and MyTelegram.FileServer are not part of this
# repository (built/published separately), so they cannot be rebuilt at the current app version.
# Pin them to the last compatible published version while the in-repo services run the freshly
# built 0.38.224.620 images. Safe because these services are pure storage backends (session/file)
# and do not depend on the push-notification changes.
services:
  # File-server and session-server are external services (built/published separately).
  session-server:
    image: ${MyTelegramRegistry}/mytelegram-session-server:latest

  file-server:
    image: ${MyTelegramRegistry}/mytelegram-file-server:latest

  # In-repo services track the "latest" tag produced by the build scripts (each build tags both
  # the versioned image and :latest), so redeploying a freshly built image no longer requires
  # bumping a pinned version here.
  messenger-query-server:
    image: ${MyTelegramRegistry}/mytelegram-messenger-query-server:latest

  messenger-command-server:
    image: ${MyTelegramRegistry}/mytelegram-messenger-command-server:latest
