# Local override: MyTelegram.SessionServer and MyTelegram.FileServer are not part of this
# repository (built/published separately), so they cannot be rebuilt at the current app version.
# Pin them to the last compatible published version while the in-repo services run the freshly
# built 0.38.224.620 images. Safe because these services are pure storage backends (session/file)
# and do not depend on the push-notification changes.
services:
  session-server:
    image: ${MyTelegramRegistry}/mytelegram-session-server:0.38.224.531

  file-server:
    image: ${MyTelegramRegistry}/mytelegram-file-server:0.38.224.531

  # Freshly rebuilt with the online-status, help.getConfig-spam (dc_id=0) fixes.
  # .704 additionally normalizes invalid media DcId (<=0) on push-update / domain-event
  # send paths (QueuedObjectMessageSender), closing the "skip queue: unknown dc" spam gap.
  messenger-query-server:
    image: ${MyTelegramRegistry}/mytelegram-messenger-query-server:0.38.224.716

  messenger-command-server:
    image: ${MyTelegramRegistry}/mytelegram-messenger-command-server:0.38.224.716
